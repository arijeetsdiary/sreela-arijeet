<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Film — Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..700;1,300..700&family=Work+Sans:wght@400;500;600;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/film.css">
</head>
<body class="film-body">

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">
      <span data-couple-names>Our Story</span>
      <small data-thread></small>
    </a>
    <nav>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="timeline.html">Timeline</a></li>
        <li><a href="albums.html">Albums</a></li>
        <li><a href="reflections.html">Reflections</a></li>
        <li><a href="film.html" class="nav-film" aria-current="page">The Film</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="film-hero">
  <div class="film-media" data-film-media></div>
  <div class="film-hero-inner">
    <div class="film-badge">
      <span class="film-badge-num">#1</span>
      <span data-film-badge>#1 in Our Memories</span>
    </div>
    <h1 class="film-title" data-film-title>The Story So Far</h1>
    <div class="film-meta" data-film-meta></div>
    <p class="film-synopsis" data-film-synopsis></p>
    <div class="film-actions">
      <button class="btn-play" data-play-video>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play Video
      </button>
      <button class="btn-info" data-more-info>More Info</button>
    </div>
  </div>
</section>

<section class="film-row-section">
  <h2 class="film-row-title">More from our story</h2>
  <div class="film-row">
    <a class="film-card" href="timeline.html">
      <div class="placeholder"><span>Timeline</span></div>
      <span class="film-card-label">The Timeline</span>
    </a>
    <a class="film-card" href="albums.html">
      <div class="placeholder"><span>Albums</span></div>
      <span class="film-card-label">The Albums</span>
    </a>
    <a class="film-card" href="index.html">
      <div class="placeholder"><span>Home</span></div>
      <span class="film-card-label">Back to Start</span>
    </a>
  </div>
</section>

<div class="video-modal" data-video-modal aria-hidden="true">
  <div class="video-modal-inner">
    <button class="video-modal-close" aria-label="Close video">&times;</button>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p data-footer-note>Made with love, for us.</p>
    <p>&copy; <span id="year"></span></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/film.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  document.querySelector("[data-footer-note]").textContent = SITE.footerNote;
</script>
</body>
</html>
